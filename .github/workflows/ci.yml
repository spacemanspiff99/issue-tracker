name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest tests/

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG: postgresql+psycopg://it:it@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migrate empty database
        run: DATABASE_URL=$PG/it_mig alembic upgrade head
      - name: Drift check
        run: DATABASE_URL=$PG/it_mig python .claude/skills/schema-change/schema_drift.py
      - name: Create test database
        run: PGPASSWORD=it psql -h localhost -U it -d it_mig -c "CREATE DATABASE it_test"
      - name: Test on Postgres
        run: TEST_DATABASE_URL=$PG/it_test python -m pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deployment/Dockerfile .
