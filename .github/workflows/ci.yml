name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest tests/

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG: postgresql+psycopg://it:it@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migrate empty database
        run: DATABASE_URL=$PG/it_mig alembic upgrade head
      - name: Drift check
        run: DATABASE_URL=$PG/it_mig python .claude/skills/schema-change/schema_drift.py
      - name: Create test database
        run: PGPASSWORD=it psql -h localhost -U it -d it_mig -c "CREATE DATABASE it_test"
      - name: Test on Postgres
        run: TEST_DATABASE_URL=$PG/it_test python -m pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deployment/Dockerfile .

  e2e:
    # Same path as remote-compose-deploy.sh RUN_BROWSER_UAT=1: compose stack, explicit migrate,
    # then the Playwright workflow suite inside the app container.
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f deployment/docker-compose.local.yml
      ADMIN_INITIAL_PASSWORD: ci-e2e-password
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: $COMPOSE up -d --build postgres app
      - name: Migrate
        run: $COMPOSE exec -T app alembic upgrade head
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Browser UAT suite
        run: $COMPOSE exec -T -e RUN_BROWSER_UAT=1 app python -m pytest -p no:cacheprovider -rfEX tests/e2e/
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p artifacts
          $COMPOSE cp app:/app/artifacts/e2e artifacts/e2e || true
          find artifacts/e2e -name '*.png' | wc -l
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: artifacts/e2e/
          if-no-files-found: warn
      - name: App logs
        if: failure()
        run: $COMPOSE logs app

  k8s:
    # deployment/k8s: render + strict schema validation, then the full deploy sequence on a
    # disposable kind cluster (issue 0020). Never touches a real cluster.
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.27.0
      KUBECONFORM_VERSION: v0.6.7
      IMAGE: ghcr.io/spacemanspiff99/issue-tracker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install kind and kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" kubeconform
          chmod +x "$HOME/bin/kind" "$HOME/bin/kubeconform"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Render and validate overlays
        run: |
          for overlay in uat uat/jobs prod prod/jobs; do
            echo "== $overlay"
            kubectl kustomize "deployment/k8s/overlays/$overlay" | kubeconform -strict -summary -
          done
      - name: Render deploys pinned by digest (no cluster)
        run: |
          digest="ghcr.io/spacemanspiff99/issue-tracker@sha256:$(printf 'a%.0s' $(seq 64))"
          for env in uat prod; do
            out="$RUNNER_TEMP/render-$env"
            RENDER_ONLY_DIR="$out" bash deployment/k8s/deploy.sh "$env" "$digest" "${{ github.sha }}"
            kubeconform -strict -summary "$out/app.yaml" "$out/jobs.yaml"
            # Every app-image container is pinned to the digest, never a tag.
            test "$(grep -ho 'image: ghcr.io.*' "$out"/*.yaml | sort -u)" = "image: $digest" \
              || { grep -hn 'image: ghcr.io' "$out"/*.yaml; exit 1; }
            # Backup and migrate share one exact backup path.
            test "$(grep -A1 'name: BACKUP_FILE' "$out/jobs.yaml" | grep -o '/backups/[^ ]*' | sort -u | wc -l)" = 1
          done
      - name: deploy.sh refuses bad inputs
        run: |
          for args in "staging img:tag ${{ github.sha }}" "uat img-without-tag ${{ github.sha }}" "uat img:tag not-a-sha" "uat img@sha256:short ${{ github.sha }}"; do
            if RENDER_ONLY_DIR="$RUNNER_TEMP/x" bash deployment/k8s/deploy.sh $args; then echo "accepted: $args" >&2; exit 1; fi
          done
      - name: No secret values in deployment/k8s
        run: |
          # Secret manifests exist only as *.example.yaml with placeholder values.
          if git ls-files deployment/k8s | grep -i secret | grep -v '\.example\.yaml$'; then
            echo "secret manifest without .example.yaml suffix" >&2; exit 1
          fi
          if git grep -nE '^kind: Secret' -- deployment/k8s ':!*.example.yaml'; then
            echo "Secret resource outside *.example.yaml" >&2; exit 1
          fi
          if git grep -nIE '(PASSWORD|SECRET_KEY|TOKEN|auth)["'"'"']?: *["'"'"']?[A-Za-z0-9+/=_-]{8,}' -- deployment/k8s | grep -v 'REPLACE_WITH'; then
            echo "possible secret value" >&2; exit 1
          fi
      - name: Build image
        run: docker build -t "$IMAGE" -f deployment/Dockerfile .
      - name: Create kind cluster
        run: |
          kind create cluster --name it-ci --wait 180s
          docker pull postgres:16
          kind load docker-image --name it-ci "$IMAGE" postgres:16
      - name: Deploy uat overlay (backup -> migrate -> rollout -> /health -> e2e)
        run: bash deployment/k8s/tests/kind-smoke.sh "$IMAGE" "${{ github.sha }}"
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-e2e-screenshots
          path: artifacts/e2e-k8s/
          if-no-files-found: warn
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,pvc,jobs -A || true
          kubectl -n issue-tracker-uat describe pods || true
          kubectl -n issue-tracker-uat logs deploy/issue-tracker --all-containers || true
          kubectl -n issue-tracker-uat logs statefulset/issue-tracker-postgres || true
