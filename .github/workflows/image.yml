name: Image

# Builds deployment/Dockerfile and pushes ghcr.io/spacemanspiff99/issue-tracker:<sha>.
# Called by k3s-pipeline.yml, which deploys the digest so UAT and production run the same
# bytes. A SHA that is already pushed is never rebuilt: every run for one commit (e.g. the UAT
# cutover rehearsal and the production cutover) gets the same digest.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Pushed image pinned by digest (ghcr.io/...@sha256:...)
        value: ${{ jobs.push.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    # One build per SHA at a time: a push-to-main build and a pipeline run for the same commit
    # queue behind each other, so the second sees the pushed tag and reuses its digest.
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.digest.outputs.image }}
    env:
      IMAGE: ghcr.io/spacemanspiff99/issue-tracker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Reuse an existing image for this SHA
        id: existing
        run: |
          # Rebuild only when the tag is absent. Any other registry error fails the job, so a
          # transient error can never give one commit a second digest.
          if manifest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/inspect.err")"; then
            digest="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["digest"])' "$manifest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not read digest for $IMAGE: $manifest" >&2; exit 1; }
            echo "already pushed: $IMAGE@$digest; not rebuilding"
            echo "image=ghcr.io/spacemanspiff99/issue-tracker@$digest" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
            echo "$IMAGE not pushed yet; building"
          else
            echo "registry error while checking $IMAGE; refusing to rebuild:" >&2
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
      - name: Build
        if: steps.existing.outputs.image == ''
        run: |
          docker build -f deployment/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE" .
      - name: Push
        if: steps.existing.outputs.image == ''
        run: docker push "$IMAGE"
      - name: Record digest
        id: digest
        env:
          EXISTING: ${{ steps.existing.outputs.image }}
        run: |
          ref="${EXISTING:-$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")}"
          [[ "$ref" =~ ^ghcr\.io/spacemanspiff99/issue-tracker@sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest ref: $ref" >&2; exit 1; }
          echo "pushed $ref"
          echo "image=$ref" >> "$GITHUB_OUTPUT"
