name: k3s UAT Production Pipeline

# Manual dispatch only. Runs on the self-hosted runner, which holds the owner-provisioned
# kubeconfig for the home-lab k3s cluster (documentation/guides/k3s.md).
on:
  workflow_dispatch:
    inputs:
      uat_url:
        description: UAT ingress URL (checked for /health)
        required: true
        default: http://issue-tracker-uat.home.arpa
      prod_url:
        description: PRODUCTION ingress URL (checked for /health)
        required: true
        default: http://issue-tracker.home.arpa
      promote_prod:
        description: Deploy the same SHA to PRODUCTION (namespace issue-tracker) after UAT passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: k3s-uat-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/spacemanspiff99/issue-tracker:${{ github.sha }}
  # Repository variable holding the kubeconfig path on the runner; empty uses ~/.kube/config.
  KUBECONFIG: ${{ vars.K3S_KUBECONFIG }}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  deploy-uat:
    name: Deploy UAT (k3s)
    needs: image
    runs-on: [self-hosted, issue-tracker, local-dev]
    environment: uat
    outputs:
      sha: ${{ steps.deployed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Backup, migrate, roll out
        run: bash deployment/k8s/deploy.sh uat "$IMAGE" "${{ github.sha }}"
      - name: Ingress /health
        env:
          URL: ${{ inputs.uat_url }}
        run: |
          body="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/health")"
          echo "$body"
          python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("database") == "ok" else 1)' "$body"
      - name: Browser workflow suite
        run: bash deployment/k8s/e2e.sh issue-tracker-uat
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-e2e-screenshots-${{ github.sha }}
          path: artifacts/e2e-k8s/
          if-no-files-found: warn
      - name: Record UAT SHA
        id: deployed
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Deploy PRODUCTION (k3s)
    needs: deploy-uat
    if: ${{ inputs.promote_prod && needs.deploy-uat.result == 'success' }}
    runs-on: [self-hosted, issue-tracker, local-dev]
    # Owner configures the `prod` environment in GitHub with a required reviewer.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Require UAT green on this SHA
        env:
          UAT_SHA: ${{ needs.deploy-uat.outputs.sha }}
        run: |
          prod_sha="$(git rev-parse HEAD)"
          if [ -z "$UAT_SHA" ] || [ "$UAT_SHA" != "$prod_sha" ] || [ "$prod_sha" != "${{ github.sha }}" ]; then
            echo "Refusing production deploy: UAT SHA '$UAT_SHA' != production SHA '$prod_sha'" >&2
            exit 1
          fi
      - name: Backup, migrate, roll out
        run: bash deployment/k8s/deploy.sh prod "$IMAGE" "${{ github.sha }}"
      - name: Ingress /health
        env:
          URL: ${{ inputs.prod_url }}
        run: |
          body="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$URL/health")"
          echo "$body"
          python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("database") == "ok" else 1)' "$body"
