# SUPERSEDED 2026-11-05: no self-hosted runners are used. UAT deploys locally via
# deployment/scripts/local-uat-deploy.sh; production moves to k3s (issue 0178,
# documentation/issues/0178-prod-k3s-shared-postgres.md). Do not dispatch.
name: App Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      uat_host:
        description: UAT host (co-hosted with the dev app on cursor-issue-tracker)
        required: true
        default: 192.168.10.20
      prod_host:
        description: Production host
        required: true
        default: 192.168.10.27
      deploy_user:
        description: SSH user on target hosts
        required: true
        default: akun
      deploy_path:
        description: Remote deployment path for production
        required: true
        default: /home/akun/issue-tracker
      uat_deploy_path:
        description: Remote deployment path for UAT (must not be the dev checkout)
        required: true
        default: /home/akun/issue-tracker-uat
      prod_env_file:
        description: Remote production env file path on app-prod
        required: true
        default: /home/akun/issue-tracker/prod.env
      deploy_prod:
        description: Deploy to production after UAT passes
        required: true
        type: boolean
        default: false
      expected_deploy_sha:
        description: Exact committed Git SHA expected to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: Deploy UAT
    runs-on: [self-hosted, issue-tracker, local-dev]
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy source
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
        run: |
          echo "Deploying ref: $GITHUB_REF"
          echo "Deploying sha: $GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_DEPLOY_SHA"
      - name: Deploy UAT to cursor-issue-tracker
        env:
          DEPLOY_ENVIRONMENT: uat
          APP_ENVIRONMENT: uat
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
          TARGET_HOST: ${{ inputs.uat_host }}
          EXPECTED_TARGET_HOST: 192.168.10.20
          EXPECTED_TARGET_HOSTNAME: cursor-issue-tracker
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.uat_deploy_path }}
          # Isolated from the live dev stack (project "deployment", container issue-tracker-postgres, port 8000).
          COMPOSE_PROJECT_NAME: issue_tracker_uat
          POSTGRES_CONTAINER_NAME: issue-tracker-uat-postgres
          APP_BASE_URL: https://uat.it.462111.xyz
          APP_HEALTHCHECK_URL: http://${{ inputs.uat_host }}:8100/health
          APP_HTTP_PORT: "8100"
          RUN_BROWSER_UAT: "1"
          RUN_TESTS: "1"
          RUN_RUFF: "1"
          SKIP_DB_BACKUP: "0"
        run: bash deployment/scripts/remote-compose-deploy.sh

  deploy-prod:
    name: Deploy Production
    runs-on: [self-hosted, issue-tracker, local-dev]
    needs: deploy-uat
    if: ${{ inputs.deploy_prod }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy source
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
        run: |
          echo "Deploying ref: $GITHUB_REF"
          echo "Deploying sha: $GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_DEPLOY_SHA"
      - name: Deploy to app-prod
        env:
          DEPLOY_ENVIRONMENT: prod
          APP_ENVIRONMENT: production
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
          TARGET_HOST: ${{ inputs.prod_host }}
          EXPECTED_TARGET_HOST: 192.168.10.27
          EXPECTED_TARGET_HOSTNAME: app-prod
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          REMOTE_ENV_FILE: ${{ inputs.prod_env_file }}
          APP_BASE_URL: https://it.462111.xyz
          APP_HEALTHCHECK_URL: http://${{ inputs.prod_host }}:8000/health
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "0"
          RUN_TESTS: "0"
          RUN_RUFF: "0"
          SKIP_DB_BACKUP: "0"
        run: bash deployment/scripts/remote-compose-deploy.sh
