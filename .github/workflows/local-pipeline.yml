name: Local Compose Dev UAT Pipeline

# Compose dev verify plus the legacy Compose UAT host. No production job: production is k3s
# namespace `issue-tracker`, deployed only by k3s-pipeline.yml (documentation/guides/k3s.md).
# The Compose production path on 192.168.10.8 is retired (Issue 0038).

on:
  workflow_dispatch:
    inputs:
      current_dev_host:
        description: Current dev host
        required: true
        default: 192.168.10.20
      uat_host:
        description: Legacy Compose UAT host (release UAT is k3s issue-tracker-uat)
        required: true
        default: 192.168.10.18
      deploy_user:
        description: SSH user on target hosts
        required: true
        default: akun
      deploy_path:
        description: Remote deployment path
        required: true
        default: /home/akun/issue-tracker

permissions:
  contents: read

concurrency:
  group: local-dev-uat
  cancel-in-progress: false

jobs:
  verify-current-dev:
    name: Verify Current Dev
    runs-on: [self-hosted, issue-tracker, local-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Verify on current dev host
        env:
          DEPLOY_ENV: dev
          TARGET_HOST: ${{ inputs.current_dev_host }}
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          APP_BASE_URL: http://${{ inputs.current_dev_host }}:8000
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "0"
          RUN_TESTS: "1"
          RUN_RUFF: "1"
          SKIP_DB_BACKUP: "1"
        run: bash deployment/scripts/remote-compose-deploy.sh

  deploy-uat:
    name: Deploy UAT
    runs-on: [self-hosted, issue-tracker, local-dev]
    needs: verify-current-dev
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to UAT
        env:
          DEPLOY_ENV: uat
          TARGET_HOST: ${{ inputs.uat_host }}
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          APP_BASE_URL: http://${{ inputs.uat_host }}:8000
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "1"
          SKIP_DB_BACKUP: "0"
        run: bash deployment/scripts/remote-compose-deploy.sh
