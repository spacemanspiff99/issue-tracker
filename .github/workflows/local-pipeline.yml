name: Local Dev UAT Production Pipeline

on:
  workflow_dispatch:
    inputs:
      current_dev_host:
        description: Current dev host
        required: true
        default: 192.168.10.20
      uat_host:
        description: UAT host
        required: true
        default: 192.168.10.18
      prod_host:
        description: PRODUCTION host (home-lab production, holds real tracker data)
        required: true
        default: 192.168.10.8
      deploy_user:
        description: SSH user on target hosts
        required: true
        default: akun
      deploy_path:
        description: Remote deployment path
        required: true
        default: /home/akun/issue-tracker
      promote_prod:
        description: Deploy to PRODUCTION after UAT passes on the same SHA
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-dev-uat-prod
  cancel-in-progress: false

jobs:
  verify-current-dev:
    name: Verify Current Dev
    runs-on: [self-hosted, issue-tracker, local-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Verify on current dev host
        env:
          DEPLOY_ENV: dev
          TARGET_HOST: ${{ inputs.current_dev_host }}
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          APP_BASE_URL: http://${{ inputs.current_dev_host }}:8000
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "0"
          RUN_TESTS: "1"
          RUN_RUFF: "1"
          SKIP_DB_BACKUP: "1"
        run: bash deployment/scripts/remote-compose-deploy.sh

  deploy-uat:
    name: Deploy UAT
    runs-on: [self-hosted, issue-tracker, local-dev]
    needs: verify-current-dev
    environment: uat
    outputs:
      sha: ${{ steps.deployed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to UAT
        env:
          DEPLOY_ENV: uat
          TARGET_HOST: ${{ inputs.uat_host }}
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          APP_BASE_URL: http://${{ inputs.uat_host }}:8000
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "1"
          SKIP_DB_BACKUP: "0"
        run: bash deployment/scripts/remote-compose-deploy.sh
      - name: Record UAT SHA
        id: deployed
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Deploy Production
    runs-on: [self-hosted, issue-tracker, local-dev]
    needs: deploy-uat
    if: ${{ inputs.promote_prod && needs.deploy-uat.result == 'success' }}
    # Owner configures the `prod` environment in GitHub with a required reviewer.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Require UAT green on this SHA
        env:
          UAT_SHA: ${{ needs.deploy-uat.outputs.sha }}
        run: |
          prod_sha="$(git rev-parse HEAD)"
          if [ -z "$UAT_SHA" ] || [ "$UAT_SHA" != "$prod_sha" ]; then
            echo "Refusing production deploy: UAT SHA '$UAT_SHA' != production SHA '$prod_sha'" >&2
            exit 1
          fi
      - name: Deploy to PRODUCTION
        env:
          DEPLOY_ENV: prod
          TARGET_HOST: ${{ inputs.prod_host }}
          TARGET_USER: ${{ inputs.deploy_user }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          APP_BASE_URL: http://${{ inputs.prod_host }}:8000
          APP_HTTP_PORT: "8000"
          RUN_BROWSER_UAT: "0"
          SKIP_DB_BACKUP: "0"
        run: bash deployment/scripts/remote-compose-deploy.sh
