name: Mirror AI guidance to vibecoding

# Canonical template. Copy to .github/workflows/mirror-rules.yml in your sub-project,
# then set PROJECT_NAME and on.push.branches for the target project.
# See https://github.com/spacemanspiff99/vibecoding/blob/main/documentation/guides/RULES_SYNC_GUIDE.md Sections 12-13.

on:
  push:
    branches:
      # issue-tracker uses main
      - main
    paths:
      - '.cursor/rules/**'
      - '.cursor/skills/**'
      - '.codex/rules/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '**/AGENTS.override.md'
      - 'CLAUDE.md'
      - '.github/workflows/mirror-rules.yml'
  workflow_dispatch: {}

concurrency:
  group: mirror-rules-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # issue-tracker: subfolder is issue-tracker/cursor-rules
      PROJECT_NAME: issue-tracker
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out vibecoding
        uses: actions/checkout@v4
        with:
          repository: spacemanspiff99/vibecoding
          path: vibecoding
          token: ${{ secrets.VIBECODING_MIRROR_TOKEN }}
          persist-credentials: true

      - name: Copy harness guidance and write provenance
        run: |
          set -euo pipefail
          RULE_DEST="vibecoding/projects/${PROJECT_NAME}/cursor-rules"
          SKILL_DEST="vibecoding/projects/${PROJECT_NAME}/cursor-skills"
          CODEX_DEST="vibecoding/projects/${PROJECT_NAME}/codex-guidance"
          CLAUDE_DEST="vibecoding/projects/${PROJECT_NAME}/claude-memory"
          mkdir -p "${RULE_DEST}" "${SKILL_DEST}" "${CODEX_DEST}" "${CLAUDE_DEST}"
          find "${RULE_DEST}" -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          find "${SKILL_DEST}" -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          find "${CODEX_DEST}" -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          find "${CLAUDE_DEST}" -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          if [ -d source/.cursor/rules ]; then
            cp -a source/.cursor/rules/. "${RULE_DEST}/"
          else
            echo "::warning::source/.cursor/rules does not exist; mirror will be empty"
          fi
          if [ -d source/.cursor/skills ]; then
            cp -a source/.cursor/skills/. "${SKILL_DEST}/"
          else
            echo "::notice::source/.cursor/skills does not exist; skill mirror will be empty"
          fi
          if [ -f source/AGENTS.md ]; then
            cp source/AGENTS.md "${CODEX_DEST}/AGENTS.md"
          fi
          if [ -d source/.codex/rules ]; then
            mkdir -p "${CODEX_DEST}/.codex/rules"
            cp -a source/.codex/rules/. "${CODEX_DEST}/.codex/rules/"
          fi
          find source -path source/.git -prune -o \
            \( -name AGENTS.md -o -name AGENTS.override.md \) -type f -print |
            while IFS= read -r f; do
              rel="${f#source/}"
              case "${rel}" in
                AGENTS.md) continue ;;
                .codex/*) continue ;;
              esac
              mkdir -p "${CODEX_DEST}/$(dirname "${rel}")"
              cp "${f}" "${CODEX_DEST}/${rel}"
            done
          if [ -f source/CLAUDE.md ]; then
            cp source/CLAUDE.md "${CLAUDE_DEST}/CLAUDE.md"
          fi
          cat > "vibecoding/projects/${PROJECT_NAME}/cursor-rules/.mirror-source.json" <<EOF
          {
            "project": "${PROJECT_NAME}",
            "source_repo": "${GITHUB_REPOSITORY}",
            "source_branch": "${GITHUB_REF_NAME}",
            "source_sha": "${GITHUB_SHA}",
            "actor": "${GITHUB_ACTOR}",
            "run_id": "${GITHUB_RUN_ID}",
            "mirrored_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp "vibecoding/projects/${PROJECT_NAME}/cursor-rules/.mirror-source.json" \
             "vibecoding/projects/${PROJECT_NAME}/cursor-skills/.mirror-source.json"
          cp "vibecoding/projects/${PROJECT_NAME}/cursor-rules/.mirror-source.json" \
             "vibecoding/projects/${PROJECT_NAME}/codex-guidance/.mirror-source.json"
          cp "vibecoding/projects/${PROJECT_NAME}/cursor-rules/.mirror-source.json" \
             "vibecoding/projects/${PROJECT_NAME}/claude-memory/.mirror-source.json"

      - name: Commit and push
        working-directory: vibecoding
        run: |
          set -euo pipefail
          git config user.name  "vibecoding-mirror[bot]"
          git config user.email "vibecoding-mirror@users.noreply.github.com"
          git add "projects/${PROJECT_NAME}/cursor-rules" \
                  "projects/${PROJECT_NAME}/cursor-skills" \
                  "projects/${PROJECT_NAME}/codex-guidance" \
                  "projects/${PROJECT_NAME}/claude-memory"
          if git diff --cached --quiet; then
            echo "No guidance changes to mirror."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          git commit -m "chore(mirror): sync ${PROJECT_NAME} AI guidance @ ${SHORT_SHA}" \
                     -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "Actor: ${GITHUB_ACTOR}" \
                     -m "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
