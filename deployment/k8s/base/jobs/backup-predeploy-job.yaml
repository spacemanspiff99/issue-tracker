apiVersion: batch/v1
kind: Job
metadata:
  name: issue-tracker-backup-predeploy
  labels:
    app.kubernetes.io/name: issue-tracker
    app.kubernetes.io/component: backup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue-tracker
        app.kubernetes.io/component: backup
    spec:
      restartPolicy: Never
      containers:
        - name: pg-dump
          image: postgres:16
          envFrom:
            - secretRef:
                name: issue-tracker-db
          env:
            # deploy.sh sets DEPLOY_SHA; the migration Job refuses to run without this dump.
            - name: DEPLOY_SHA
              value: unset
            - name: PGHOST
              value: issue-tracker-postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: issue-tracker-db
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -euc
            - |
              test "$DEPLOY_SHA" != unset
              mkdir -p /backups/pre-migration
              f="/backups/pre-migration/${DEPLOY_SHA}-$(date -u +%Y%m%dT%H%M%SZ).dump"
              pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$f.partial"
              pg_restore -l "$f.partial" > /dev/null
              mv "$f.partial" "$f"
              echo "wrote $f ($(du -h "$f" | cut -f1))"
              ls -1t /backups/pre-migration/*.dump | tail -n +6 | xargs -r rm -fv
              df -h /backups
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: issue-tracker-backups
