apiVersion: v1
kind: Service
metadata:
  name: issue-tracker-postgres
  labels:
    app.kubernetes.io/name: issue-tracker
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: issue-tracker
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: issue-tracker-postgres
  labels:
    app.kubernetes.io/name: issue-tracker
    app.kubernetes.io/component: database
spec:
  serviceName: issue-tracker-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: issue-tracker
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue-tracker
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.15
          # WAL capped per the Storage Sizing table in documentation/issues/0020-k3s-deployment.md.
          args:
            - -c
            - max_wal_size=256MB
            - -c
            - min_wal_size=64MB
            - -c
            - wal_keep_size=0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: issue-tracker-db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
