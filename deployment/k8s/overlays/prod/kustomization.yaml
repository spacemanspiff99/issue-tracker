apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: issue-tracker
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/instance: prod
# Overlay values (defaults documented in documentation/guides/k3s.md):
#   storage class  local-path (k3s default); set to e.g. longhorn below
#   ingress host   issue-tracker.home.arpa
#   resources      base defaults (Postgres requests 100m CPU / 256Mi RAM)
patches:
  - target:
      kind: StatefulSet
      name: issue-tracker-postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
  - target:
      kind: PersistentVolumeClaim
      name: issue-tracker-backups
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path
  - target:
      kind: Ingress
      name: issue-tracker
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: issue-tracker.home.arpa
  - target:
      kind: ConfigMap
      name: issue-tracker-config
    patch: |-
      - op: replace
        path: /data/APP_BASE_URL
        value: http://issue-tracker.home.arpa
