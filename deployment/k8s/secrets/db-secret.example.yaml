# EXAMPLE ONLY - not referenced by any kustomization. Never commit real values.
# Create the real Secret with the commands in documentation/guides/k3s.md, per namespace.
# POSTGRES_PASSWORD must be URL-safe (it is embedded in DATABASE_URL): use `openssl rand -hex 24`.
apiVersion: v1
kind: Secret
metadata:
  name: issue-tracker-db
  namespace: issue-tracker-uat
type: Opaque
stringData:
  POSTGRES_USER: issue_tracker
  POSTGRES_DB: issue_tracker
  POSTGRES_PASSWORD: REPLACE_WITH_HEX_PASSWORD
