{% extends "base.html" %}
{% block body %}
<h1>Projects</h1>
<form method="post" action="/logout"><button type="submit">Logout</button></form>
<form method="post" action="/projects" class="row">
  <label>Name <input name="name" required></label>
  <label>Repo URL <input name="repo_url"></label>
  <button type="submit">Create project</button>
</form>
<table>
  <tr><th>Name</th><th>Repo</th></tr>
  {% for project in projects %}
  <tr><td><a href="/projects/{{ project.id }}">{{ project.name }}</a></td><td>{{ project.repo_url or "" }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
